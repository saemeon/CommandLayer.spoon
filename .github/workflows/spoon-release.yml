# Publishes the Spoon the way SpoonInstall installs it: a branch, "spoons",
# holding docs/docs.json and Spoons/CommandLayer.spoon.zip, written by
# scripts/spoon-release.sh. On every version tag, or started by hand.
name: Publish for SpoonInstall

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the zip and docs.json
        run: sh scripts/spoon-release.sh "$RUNNER_TEMP/spoons"

      - name: Replace the spoons branch with them
        working-directory: ${{ runner.temp }}/spoons
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b spoons
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "CommandLayer.spoon from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" spoons
